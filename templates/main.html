{% extends "base.html" %}
{% block content %}
    <h1>Chat, chien ou oiseau ?</h1>
    <p class="lead">Envoyez une photo, le modèle vous dit quel animal il voit.</p>

    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

    <form action="{{ url_for('predict') }}" method="post" enctype="multipart/form-data">
        <label class="dropzone" for="inputPicture">
            <img id="preview" alt="Aperçu de l'image choisie" hidden>
            <span id="hint">Cliquez ou déposez une image ici<br><small>JPG, PNG ou WEBP, 8 Mo max</small></span>
        </label>
        <input type="file" id="inputPicture" name="file" accept=".png,.jpg,.jpeg,.webp" required>
        <button type="submit" id="submitBtn" disabled>Identifier l'animal</button>
    </form>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='main.js') }}"></script>{% endblock %}
