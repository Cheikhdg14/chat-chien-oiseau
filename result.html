{% extends "base.html" %}
{% block title %}{{ label }}{% endblock %}
{% block content %}
    <h1>{{ label }}</h1>
    <img class="result-img" src="{{ image_url }}" alt="Image analysée">

    <ul class="scores">
        {% for name, p in ranked %}
        <li class="{{ 'top' if name == best_fr }}">
            <span class="name">{{ name|capitalize }}</span>
            <span class="bar"><span style="width: {{ (p * 100)|round(1) }}%"></span></span>
            <span class="pct">{{ (p * 100)|round(1) }} %</span>
        </li>
        {% endfor %}
    </ul>

    <a class="button" href="{{ url_for('home') }}">Essayer une autre image</a>
{% endblock %}
